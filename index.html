<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ECHO.Academy</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23000'/%3E%3Cpath d='M20 30v10c0 4 24 4 24 0V30z' fill='%23d9b46c'/%3E%3Cpath d='M6 26 32 14l26 12-26 12z' fill='%23f6e2b0' stroke='%23c8944a' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='M52 28v14' stroke='%23c8944a' stroke-width='2'/%3E%3C/svg%3E">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root{
  --bg:#000;
  --text:#f0f0f0;
  --muted:#8a8a8e;
  --dim:#5c5c60;
  --chrome:#e4e4e6;
  --chrome2:#9a9a9e;
  --line:rgba(255,255,255,.1);
  --line2:rgba(255,255,255,.16);
  --glass:rgba(255,255,255,.04);
  --glass2:rgba(255,255,255,.07);
  --ok:#3dff9a;
  --wait:#ffd56a;
  --bad:#ff5c5c;
  --info:#7eb6ff;
  --radius:18px;
  --font:'Manrope',system-ui,sans-serif;
  --display:'Cormorant Garamond',Georgia,serif;
  --ease:cubic-bezier(.22,1,.36,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;color:var(--text)}
html{-webkit-font-smoothing:antialiased}
body{
  min-height:100dvh;overflow-x:hidden;font-family:var(--font);font-size:14px;line-height:1.45;
  background:#000;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
button:disabled{opacity:.35;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible{outline:1px solid rgba(255,255,255,.35);outline-offset:3px}
::selection{background:rgba(255,255,255,.2)}

.chrome-text{
  background:linear-gradient(180deg,#fff 0%,#d4d4d8 40%,#8a8a90 78%,#c8c8cc 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}


/* ========== SPLASH — real logo parts ========== */
.splash{
  position:fixed;inset:0;z-index:80;
  display:grid;place-items:center;
  background:#000;
  perspective:1400px;
  perspective-origin:50% 45%;
  transition:opacity 1.15s cubic-bezier(.16,1,.3,1), visibility 1.15s;
}
.splash.hide{opacity:0;visibility:hidden;pointer-events:none}
.splash-stage{
  position:relative;
  width:min(320px,78vw);
  height:min(320px,78vw);
  transform-style:preserve-3d;
}
.part{
  position:absolute;
  transform-style:preserve-3d;
  will-change:transform,opacity;
  opacity:0;
  pointer-events:none;
}
.part img{
  width:100%;height:100%;display:block;object-fit:contain;
  /* no glow */
}
/* positions match original composition (meta %) */
.part-hat{left:12.44%;top:26.4%;width:85.09%;height:49.04%;z-index:6}
.part-crystal-tr{z-index:4;left:65.23%;top:13.56%;width:24.64%;height:17.86%}
.part-crystal-bl{z-index:4;left:2.87%;top:48.49%;width:21.77%;height:15.87%}
.part-sphere-l{z-index:3;left:16.35%;top:62.68%;width:18.42%;height:14.75%}
.part-sphere-r{z-index:3;left:81.74%;top:40.11%;width:14.43%;height:10.93%}

/* fly-ins with 3D volume */
.part-crystal-tr{animation:inCTR 1.2s cubic-bezier(.22,1,.36,1) .12s forwards}
.part-crystal-bl{animation:inCBL 1.2s cubic-bezier(.22,1,.36,1) .22s forwards}
.part-sphere-l{animation:inSL 1.25s cubic-bezier(.22,1,.36,1) .35s forwards}
.part-sphere-r{animation:inSR 1.25s cubic-bezier(.22,1,.36,1) .42s forwards}
.part-hat{animation:inHat 1.3s cubic-bezier(.22,1,.36,1) .4s forwards}

@keyframes inCTR{
  0%{opacity:0;transform:translate3d(120%,-90%,-280px) rotateY(55deg) rotateZ(25deg) scale(.4)}
  100%{opacity:1;transform:translate3d(0,0,48px) rotateY(-8deg) rotateZ(-4deg) scale(1)}
}
@keyframes inCBL{
  0%{opacity:0;transform:translate3d(-130%,80%,-260px) rotateY(-50deg) rotateZ(-20deg) scale(.35)}
  100%{opacity:1;transform:translate3d(0,0,40px) rotateY(6deg) rotateZ(3deg) scale(1)}
}
@keyframes inSL{
  0%{opacity:0;transform:translate3d(-140%,60%,-300px) scale(.25)}
  100%{opacity:1;transform:translate3d(0,0,56px) scale(1)}
}
@keyframes inSR{
  0%{opacity:0;transform:translate3d(150%,-40%,-300px) scale(.25)}
  100%{opacity:1;transform:translate3d(0,0,52px) scale(1)}
}
@keyframes inHat{
  0%{opacity:0;transform:translate3d(0,70%,-240px) scale(.35)}
  100%{opacity:1;transform:translate3d(0,0,28px) scale(1)}
}

.splash-copy{
  position:absolute;left:50%;bottom:12%;transform:translateX(-50%);
  text-align:center;width:90%;
  opacity:0;animation:riseCopy .85s cubic-bezier(.16,1,.3,1) 2.55s forwards;
}
.splash-brand{
  font-family:var(--display);font-size:clamp(26px,7vw,36px);font-weight:600;letter-spacing:.02em;
}
.splash-tag{
  margin-top:8px;font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--muted);
}
@keyframes riseCopy{from{opacity:0;transform:translateX(-50%) translateY(12px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

@media (prefers-reduced-motion:reduce){
  .part,.splash-copy{animation:none!important;opacity:1!important;transform:none!important}
}

.app{position:relative;z-index:2;width:min(100%,440px);margin:0 auto;padding:16px 16px 52px;background:transparent}
@media(min-width:600px){.app{width:min(100%,470px);padding-top:22px}}

.topline{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand-lockup{display:flex;align-items:center;gap:10px}
.brand-logo{width:40px;height:40px;object-fit:contain}
.brand-text{display:flex;flex-direction:column;gap:1px}
.brand-name{
  font-family:var(--display);font-size:17px;font-weight:600;letter-spacing:.01em;line-height:1.1;
  background:linear-gradient(180deg,#fff 10%,#c0c0c4 55%,#888 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.brand-sub{font-size:9px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase}

.iconbtn{
  width:40px;height:40px;border-radius:50%;display:grid;place-items:center;
  background:var(--glass);border:1px solid var(--line);
  transition:transform .3s var(--ease),background .2s,border-color .2s;
  position:relative;
}
.iconbtn:hover{background:var(--glass2);border-color:var(--line2)}
.iconbtn:active{transform:scale(.96)}
.iconbtn svg{width:17px;height:17px;opacity:.9}
.dot{position:absolute;right:9px;top:9px;width:6px;height:6px;border-radius:50%;background:#fff}

.identity{margin:22px 0 4px;opacity:0;animation:fadeUp .65s var(--ease-out) .05s forwards}
.name{font-size:24px;font-weight:600;letter-spacing:-.03em}
.role-line{margin-top:4px;font-size:12px;color:var(--muted)}
.balance-wrap{margin:14px 0 4px;opacity:0;animation:fadeUp .65s var(--ease-out) .1s forwards}
.balance{
  font-size:clamp(32px,8vw,40px);font-weight:600;letter-spacing:-.04em;
  background:linear-gradient(180deg,#fff 0%,#b0b0b4 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.balance-label{margin-top:2px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}

@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.people-switch{
  display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none;
  opacity:0;animation:fadeUp .65s var(--ease-out) .14s forwards;
}
.people-switch::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;min-height:38px;padding:0 14px;border-radius:99px;
  background:var(--glass);border:1px solid var(--line);font-size:12px;font-weight:500;
  color:var(--chrome2);white-space:nowrap;transition:all .3s var(--ease);
}
.chip:hover{border-color:var(--line2);color:var(--text)}
.chip.active{
  background:linear-gradient(180deg,#f2f2f4,#c4c4c8);
  color:#0a0a0a;border-color:transparent;
}

.stack{display:flex;flex-direction:column;gap:11px;margin-top:10px}
.card{
  border-radius:var(--radius);padding:16px;
  background:var(--glass);
  border:1px solid var(--line);
  opacity:0;transform:translateY(14px);
  animation:cardIn .65s var(--ease-out) forwards;
  transition:border-color .25s;
}
.card:hover{border-color:var(--line2)}
.stack>.card:nth-child(1){animation-delay:.05s}
.stack>.card:nth-child(2){animation-delay:.1s}
.stack>.card:nth-child(3){animation-delay:.15s}
.stack>.card:nth-child(4){animation-delay:.2s}
.stack>.card:nth-child(5){animation-delay:.25s}
@keyframes cardIn{to{opacity:1;transform:none}}

.card-title{font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-bottom:12px}
.muted{color:var(--muted);font-size:12px}
.dim{color:var(--dim);font-size:11px}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{padding:12px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06)}
.stat-val{font-size:20px;font-weight:600;letter-spacing:-.03em}
.stat-label{margin-top:3px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}

.pill{display:inline-flex;align-items:center;padding:3px 9px;border-radius:99px;font-size:10px;font-weight:600;letter-spacing:.04em;background:rgba(255,255,255,.07);color:var(--chrome2)}
.pill.ok{background:rgba(61,255,154,.1);color:var(--ok)}
.pill.wait{background:rgba(255,213,106,.1);color:var(--wait)}
.pill.bad{background:rgba(255,92,92,.1);color:var(--bad)}
.pill.info{background:rgba(126,182,255,.1);color:var(--info)}

.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.row:last-child{border-bottom:none;padding-bottom:0}
.row:first-child{padding-top:0}
.row-title{font-size:13px;font-weight:500}
.row-sub{font-size:11px;color:var(--muted);margin-top:2px}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:44px;padding:0 16px;border-radius:99px;font-size:13px;font-weight:600;
  background:linear-gradient(180deg,#f4f4f6,#c0c0c4);color:#0a0a0a;border:1px solid rgba(255,255,255,.15);
  transition:transform .3s var(--ease),opacity .2s;
}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--glass);color:var(--text);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--glass2);border-color:var(--line2)}
.btn.block{width:100%}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn-row .btn{flex:1;min-width:110px}

.tabs{display:flex;gap:3px;padding:3px;border-radius:12px;margin-bottom:2px;background:rgba(255,255,255,.03);border:1px solid var(--line);opacity:0;animation:fadeUp .55s var(--ease-out) .06s forwards}
.tab{flex:1;min-height:34px;padding:0 6px;border-radius:9px;font-size:11px;font-weight:600;color:var(--muted);transition:all .25s}
.tab.active{background:rgba(255,255,255,.1);color:var(--text);border:1px solid rgba(255,255,255,.08)}
.tab:hover:not(.active){color:var(--chrome2)}

.field{margin-bottom:11px}
.field label{display:block;font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:5px}
.field input,.field select{width:100%;min-height:44px;padding:0 12px;border-radius:11px;background:rgba(0,0,0,.5);border:1px solid var(--line);color:var(--text)}
.field input:focus,.field select:focus{border-color:var(--line2)}
.field select option{background:#111}
.type-row{display:flex;gap:8px;margin-bottom:11px}
.typebtn{flex:1;min-height:50px;padding:8px 10px;border-radius:12px;text-align:left;background:var(--glass);border:1px solid var(--line);transition:all .25s}
.typebtn strong{display:block;font-size:12px;font-weight:600}
.typebtn span{font-size:10px;color:var(--muted)}
.typebtn.active{border-color:rgba(255,255,255,.28);background:rgba(255,255,255,.08)}

.chart{display:flex;align-items:flex-end;gap:5px;height:64px;margin-top:8px}
.bar{flex:1;border-radius:5px 5px 2px 2px;background:linear-gradient(180deg,rgba(255,255,255,.45),rgba(255,255,255,.06));transform-origin:bottom;transform:scaleY(0);animation:barUp .7s var(--ease-out) forwards}
@keyframes barUp{to{transform:scaleY(1)}}

.link-box{margin-top:8px;padding:11px 12px;border-radius:11px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);font-size:11px;color:var(--chrome2);word-break:break-all;line-height:1.4}


.why-btn-wrap{margin-top:4px;opacity:0;animation:fadeUp .65s var(--ease-out) .16s forwards}
.why-btn{
  width:100%;min-height:52px;border-radius:16px;padding:0 18px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:linear-gradient(135deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
  border:1px solid var(--line);color:var(--text);font-weight:600;font-size:14px;
  transition:border-color .25s,transform .3s var(--ease);
}
.why-btn:hover{border-color:var(--line2)}
.why-btn:active{transform:scale(.98)}
.why-btn span.arrow{opacity:.45;font-size:18px;letter-spacing:0}

/* full-screen story */
.why{
  position:fixed;inset:0;z-index:90;background:#000;
  opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .45s var(--ease-out),visibility .45s;
}
.why.open{opacity:1;visibility:visible;pointer-events:auto}
.why-close{
  position:absolute;top:max(14px,env(safe-area-inset-top));right:14px;z-index:5;
  width:40px;height:40px;border-radius:50%;
  background:rgba(255,255,255,.06);border:1px solid var(--line);
  display:grid;place-items:center;font-size:18px;color:var(--chrome2);
}
.why-stage{
  position:absolute;inset:0;display:grid;place-items:center;
  perspective:1200px;
}
/* constellation of 4 nodes */
.why-orbit{
  position:relative;width:min(300px,82vw);height:min(300px,82vw);
  transform-style:preserve-3d;
}
.why-node{
  position:absolute;width:72px;height:72px;margin:-36px 0 0 -36px;
  border-radius:20px;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.14);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  opacity:0;transform:scale(.3) translateZ(-200px);
  transition:none;
}
.why-node .sym{font-size:18px;line-height:1;color:#e8e8ea}
.why-node .lbl{font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.why-node.n0{left:50%;top:18%}
.why-node.n1{left:82%;top:50%}
.why-node.n2{left:50%;top:82%}
.why-node.n3{left:18%;top:50%}
.why.open.phase-orbit .why-node{animation:nodeIn .7s var(--ease-out) forwards}
.why.open.phase-orbit .why-node.n0{animation-delay:.15s}
.why.open.phase-orbit .why-node.n1{animation-delay:.3s}
.why.open.phase-orbit .why-node.n2{animation-delay:.45s}
.why.open.phase-orbit .why-node.n3{animation-delay:.6s}
@keyframes nodeIn{to{opacity:1;transform:scale(1) translateZ(0)}}

.why-orbit-title{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  text-align:center;opacity:0;pointer-events:none;
}
.why.open.phase-orbit .why-orbit-title{animation:fadeIn .6s .9s forwards}
.why-orbit-title strong{
  display:block;font-family:var(--display);font-size:22px;font-weight:600;
  background:linear-gradient(180deg,#fff,#888);-webkit-background-clip:text;background-clip:text;color:transparent;
}
.why-orbit-title small{display:block;margin-top:6px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}

/* zoom focus then hide orbit */
.why.phase-zoom .why-node.n0{
  animation:none;opacity:1;
  transition:transform .9s var(--ease-out), left .9s var(--ease-out), top .9s var(--ease-out), width .9s, height .9s, margin .9s, border-radius .9s, background .9s;
  left:50%;top:50%;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:28px;
  background:rgba(255,255,255,.08);z-index:2;
}
.why.phase-zoom .why-node:not(.n0){
  animation:none;opacity:0;transition:opacity .5s;transform:scale(.6);
}
.why.phase-zoom .why-orbit-title{opacity:0;transition:opacity .3s}

/* story track */
.why-story{
  position:absolute;inset:0;display:flex;overflow-x:auto;overflow-y:hidden;
  scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;opacity:0;pointer-events:none;
  transition:opacity .5s .15s;
}
.why-story::-webkit-scrollbar{display:none}
.why.phase-story .why-orbit{opacity:0;pointer-events:none;transition:opacity .4s}
.why.phase-story .why-story{opacity:1;pointer-events:auto}

.why-slide{
  flex:0 0 100%;width:100%;height:100%;scroll-snap-align:center;scroll-snap-stop:always;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:56px 24px 80px;box-sizing:border-box;position:relative;
}
.why-visual{
  width:min(260px,70vw);height:min(260px,70vw);position:relative;margin-bottom:28px;
  display:grid;place-items:center;
}
.why-copy{max-width:340px;text-align:center}
.why-copy .kicker{
  font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--dim);margin-bottom:10px;
}
.why-copy h2{
  font-family:var(--display);font-size:clamp(28px,8vw,36px);font-weight:600;letter-spacing:.02em;margin-bottom:12px;
  background:linear-gradient(180deg,#fff 0%,#a0a0a4 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.why-copy p{font-size:14px;line-height:1.55;color:var(--muted)}
.why-dots{
  position:absolute;left:0;right:0;bottom:max(28px,env(safe-area-inset-bottom));
  display:flex;justify-content:center;gap:8px;z-index:3;
  opacity:0;pointer-events:none;transition:opacity .4s;
}
.why.phase-story .why-dots{opacity:1}
.why-dots i{
  width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.2);
  transition:background .3s,transform .3s;
}
.why-dots i.on{background:#fff;transform:scale(1.25)}
.why-hint{
  position:absolute;bottom:max(48px,calc(env(safe-area-inset-bottom) + 40px));
  left:0;right:0;text-align:center;font-size:11px;color:var(--dim);letter-spacing:.08em;
  opacity:0;transition:opacity .4s;
}
.why.phase-story .why-hint{opacity:1;animation:hintPulse 2.4s ease infinite}
@keyframes hintPulse{0%,100%{opacity:.5}50%{opacity:1}}

/* unique visuals per slide */
.v-practice{position:relative;width:100%;height:100%}
.v-practice .code-line{
  position:absolute;left:10%;right:10%;height:10px;border-radius:4px;
  background:linear-gradient(90deg,rgba(255,255,255,.25),rgba(255,255,255,.04));
  opacity:0;transform:translateX(-20px);
  animation:codeIn .6s var(--ease-out) forwards;
}
.v-practice .code-line:nth-child(1){top:22%;width:70%;animation-delay:.1s}
.v-practice .code-line:nth-child(2){top:36%;width:55%;animation-delay:.2s}
.v-practice .code-line:nth-child(3){top:50%;width:78%;animation-delay:.3s}
.v-practice .code-line:nth-child(4){top:64%;width:42%;animation-delay:.4s}
.v-practice .code-line:nth-child(5){top:78%;width:60%;animation-delay:.5s}
.v-practice .bracket{
  position:absolute;font-family:var(--display);font-size:72px;color:rgba(255,255,255,.12);
  animation:fadeIn 1s .3s both;
}
.v-practice .bracket.l{left:0;top:30%}
.v-practice .bracket.r{right:0;top:30%}
@keyframes codeIn{to{opacity:1;transform:none}}

.v-support{position:relative;width:100%;height:100%}
.v-support .ring{
  position:absolute;left:50%;top:50%;border-radius:50%;border:1px solid rgba(255,255,255,.15);
  transform:translate(-50%,-50%) scale(.6);opacity:0;
  animation:ringPop .8s var(--ease-out) forwards;
}
.v-support .ring.r1{width:70%;height:70%;animation-delay:.1s}
.v-support .ring.r2{width:100%;height:100%;animation-delay:.25s}
.v-support .core{

  document.body.appendChild(el);
  const sc = el.querySelector('#wy-scroll'), chaps = [...sc.children], dots = [...el.querySelectorAll('.wy-dots i')];
  const setDot = i => dots.forEach((d,k) => d.classList.toggle('on', k === i));
  setDot(0);
  if (matchMedia('(prefers-reduced-motion:reduce)').matches || !('IntersectionObserver' in window)) chaps.forEach(c => c.classList.add('in'));
  else {
    const io = new IntersectionObserver(es => es.forEach(e => {
      if (e.intersectionRatio >= .55) { e.target.classList.add('in'); setDot(chaps.indexOf(e.target)); }
      else e.target.classList.remove('in');

  }
  el.querySelectorAll('.wy-dots button').forEach((b,i) => b.addEventListener('click', () => chaps[i].scrollIntoView({behavior:'smooth'})));

    <div class="card">
      <div class="card-title">Мои курсы</div>
      ${paid.length ? paid.map(d => {
        const lead = state.leads.find(l => l.id === d.leadId);
        const c = course(lead?.courseId);
        return `<div class="row"><div><div class="row-title">${c?c.title:'Курс'}</div><div class="row-sub">${shortMoney(d.totalAmount)}</div></div><span class="pill ok">оплачен</span></div>`;
      }).join('') : '<p class="muted">Оплаченных курсов нет</p>'}
    </div>
    <div class="card">
      <div class="card-title">Направления</div>
      ${state.courses.map(c => `
        <div class="row">
          <div><div class="row-title">${c.title}</div><div class="row-sub">${c.type==='group'?'Группа':'Индивидуально'} · ${c.durationDays} дн.</div></div>
          <div style="text-align:right"><div class="row-title">${shortMoney(c.basePrice)}</div>
          <button class="btn ghost" style="min-height:30px;padding:0 11px;font-size:11px;margin-top:6px" data-action="buy" data-course="${c.id}">Выбрать</button></div>
        </div>`).join('')}
    </div>
    ${open.length ? `<div class="card"><div class="card-title">К оплате</div>${open.map(l => {
      const c = course(l.courseId);
      return `<div class="row"><div><div class="row-title">${c?c.title:'Курс'}</div><div class="row-sub">${statusPill(l.status)}</div></div>
        ${l.status==='waiting_payment'?`<button class="btn" style="min-height:34px;padding:0 12px;font-size:12px" data-action="pay" data-lead="${l.id}">Оплатить</button>`:''}
      </div>`;
    }).join('')}</div>` : ''}`;
}

function systemPanel() {
  const paid = state.leads.filter(l => l.status === 'paid').length;
  const revenue = state.deals.reduce((s,d) => s + d.totalAmount, 0);
  return `
    <div class="card">
      <div class="card-title">Система</div>
      <div class="stats">
        <div class="stat"><div class="stat-val">${state.users.length}</div><div class="stat-label">пользователей</div></div>
        <div class="stat"><div class="stat-val">${paid}</div><div class="stat-label">оплат</div></div>
        <div class="stat"><div class="stat-val">${shortMoney(revenue)}</div><div class="stat-label">оборот</div></div>
        <div class="stat"><div class="stat-val">${state.leads.length}</div><div class="stat-label">лидов</div></div>
      </div>
      ${chart([1,2,2,3,1,4,3,5])}
    </div>`;
}

function dealPanel() {
  const students = state.users.filter(u => u.role === 'student');
  const teachers = state.users.filter(u => u.role === 'teacher');
  const traffers = state.users.filter(u => u.role === 'traffer');
  const preview = split(dealType, !dealNoTraffer, dealType === 'group');
  return `
    <div class="card">
      <div class="card-title">Новая сделка</div>
      <div class="type-row">
        <button class="typebtn ${dealType==='individual'?'active':''}" data-action="deal-type" data-type="individual"><strong>Индивидуально</strong><span>90 000 ₽</span></button>
        <button class="typebtn ${dealType==='group'?'active':''}" data-action="deal-type" data-type="group"><strong>Группа</strong><span>180 000 ₽</span></button>
      </div>
      <div class="field"><label>Ученик</label><select data-field="dealStudent">${students.map(u=>`<option value="${u.id}" ${u.id==+dealStudent?'selected':''}>${u.fullName}</option>`).join('')}</select></div>
      <div class="field"><label>Преподаватель</label><select data-field="dealTeacher">${teachers.map(u=>`<option value="${u.id}" ${u.id==+dealTeacher?'selected':''}>${u.fullName}</option>`).join('')}</select></div>
      <div class="field"><label>Трафер</label>
        <select data-field="dealTraffer" ${dealNoTraffer?'disabled':''}>${traffers.map(u=>`<option value="${u.id}" ${u.id==+dealTraffer?'selected':''}>${u.fullName}</option>`).join('')}</select>
      </div>
      <label style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-bottom:12px">
        <input type="checkbox" data-action="toggle-traffer" ${dealNoTraffer?'checked':''}> Без трафера
      </label>
      <div class="stats" style="margin-bottom:12px">
        <div class="stat"><div class="stat-val" style="font-size:15px">${shortMoney(preview.total)}</div><div class="stat-label">сумма</div></div>
        <div class="stat"><div class="stat-val" style="font-size:15px">${shortMoney(preview.teacherCut)}</div><div class="stat-label">преподаватель</div></div>
        <div class="stat"><div class="stat-val" style="font-size:15px">${shortMoney(preview.trafferCut)}</div><div class="stat-label">трафер</div></div>
        <div class="stat"><div class="stat-val" style="font-size:15px">${shortMoney(preview.adminCut)}</div><div class="stat-label">админ</div></div>
      </div>
      <button class="btn block" data-action="create-deal">Подтвердить сделку</button>
    </div>`;
}

function payoutsPanel() {
  const withBal = state.users.filter(u => u.balance > 0 && u.role !== 'student');
  return `
    <div class="card">
      <div class="card-title">К выплате</div>
      ${withBal.length ? withBal.map(u => `
        <div class="row">
          <div class="who">${av(u.fullName)}<div><div class="row-title">${u.fullName}</div><div class="row-sub">${ROLE[u.role]} · ${shortMoney(u.balance)}</div></div></div>
          <button class="btn" style="min-height:34px;padding:0 12px;font-size:12px" data-action="pick-payout" data-id="${u.id}">Выплатить</button>
        </div>`).join('') : '<p class="muted">Некому выплачивать</p>'}
    </div>
    ${payoutPicked ? (() => {
      const p = user(payoutPicked);
      return `<div class="card">
        <div class="card-title">Выплата · ${p.fullName}</div>
        <div class="field"><label>Сумма</label><input type="number" data-field="payoutAmount" value="${payoutAmount||p.balance}" min="1" max="${p.balance}"></div>
        <button class="btn block" data-action="do-payout">Подтвердить</button>
      </div>`;
    })() : ''}`;
}

function adminHome() {
  const tabs = [['overview','Система'],['leads','Лиды'],['deal','Сделка'],['payouts','Выплаты']];
  return `
    <div class="tabs">${tabs.map(([id,label]) => `<button class="tab ${tab===id?'active':''}" data-action="tab" data-tab="${id}">${label}</button>`).join('')}</div>
    ${tab==='overview'?systemPanel():tab==='leads'?leadList('Все лиды', state.leads):tab==='deal'?dealPanel():payoutsPanel()}`;
}

function render() {
  const active = user(state.activeUserId) || state.users[0];
  if (!active) return;
  document.body.dataset.role = active.role;
  $('#app').innerHTML = `
    ${header(active)}
    <div class="identity">
      <p class="name">${active.fullName}</p>
      <p class="role-line">${ROLE[active.role]}${active.username ? ' · @'+active.username : ''}</p>
    </div>
    <div class="balance-wrap">
      <div class="echo" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="balance">${money(active.balance)}</div>
      <div class="balance-label">к выплате</div>
    </div>
    <div class="stack">
      ${active.role==='traffer'?trafferHome(active):active.role==='teacher'?teacherHome(active):active.role==='student'?studentHome(active):adminHome()}
    </div>
    <footer class="footer">
      <span class="footer-brand">ECHO.Academy</span>
      <button class="btn ghost" data-action="reset" style="min-height:32px;padding:0 12px;font-size:11px">Сбросить</button>
    </footer>`;
  renderNotices(active);
}

function renderNotices(active) {
  let panel = $('#notices');
  if (!panel) {
    panel = document.createElement('div');
    panel.id = 'notices';
    document.body.appendChild(panel);
  }
  const mine = state.notices.filter(n => n.userId === active.id);
  panel.className = 'notices' + (bell ? ' open' : '');
  panel.innerHTML = `
    <div class="notices-panel">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <strong style="font-family:var(--display);font-size:20px;letter-spacing:.02em">Уведомления</strong>
        <button class="btn ghost" style="min-height:30px;padding:0 12px;font-size:11px" data-action="close-bell">Закрыть</button>
      </div>
      ${mine.length ? mine.map(n => `
        <div class="notice-item ${n.read?'':'unread'}">
          <div class="row-title">${n.title}</div>
          <div class="row-sub">${n.body} · ${dateLabel(n.createdAt)}</div>
        </div>`).join('') : '<p class="muted">Пусто</p>'}
    </div>`;
  if (bell) { mine.forEach(n => n.read = true); save(); }
}

function addNotice(userId, title, body) {
  state.notices.unshift({id: state.nextNoticeId++, userId, title, body, read:false, createdAt: new Date().toISOString()});
}

document.addEventListener('click', e => {
  const btn = e.target.closest('[data-action]');
  if (!btn) {
    if (e.target.id === 'notices') { bell = false; render(); }
    return;
  }
  const a = btn.dataset.action;
  let message = '';
  const active = user(state.activeUserId);

  if (a === 'open-why') { openWhy(); return; }
  else if (a === 'close-why') { closeWhy(); return; }
  else if (a === 'switch') { state.activeUserId = +btn.dataset.id; bell = false; tab = 'overview'; }
  else if (a === 'bell') { bell = !bell; }
  else if (a === 'close-bell') { bell = false; }
  else if (a === 'tab') { tab = btn.dataset.tab; }
  else if (a === 'copy-link') {
    navigator.clipboard?.writeText(refLink(active.refCode));
    message = 'Ссылка скопирована';
  }
  else if (a === 'request-payout') {
    addNotice(IDS.admin, 'Запрос на вывод', `${active.fullName} · ${shortMoney(active.balance)}`);
    message = 'Запрос отправлен админу';
  }
  else if (a === 'buy') {
    const c = course(btn.dataset.course);
    const existing = state.leads.find(l => l.studentId === active.id && ['new','calling','waiting_payment'].includes(l.status));
    if (existing) message = 'Уже есть открытый счёт';
    else {
      state.leads.push({id: state.nextLeadId++, studentId: active.id, trafferId: null, courseId: c.id, status: 'waiting_payment', createdAt: new Date().toISOString()});
      message = `Счёт: ${c.title}`;
    }
  }
  else if (a === 'pay') {
    const lead = state.leads.find(l => l.id === +btn.dataset.lead);
    if (!lead || lead.status !== 'waiting_payment') return;
    const c = course(lead.courseId);
    const s = split(c.type, !!lead.trafferId, c.type === 'group');
    lead.status = 'paid';
    state.deals.push({
      id: state.nextDealId++, leadId: lead.id, studentId: lead.studentId, trafferId: lead.trafferId, teacherId: IDS.teacher,
      groupId: c.type==='group' ? `G-${state.nextDealId}` : null,
      totalAmount: s.total, trafferCut: s.trafferCut, teacherCut: s.teacherCut, adminCut: s.adminCut,
      paymentStatus: 'success', payoutStatus: 'unpaid', createdAt: new Date().toISOString()
    });
    const teacher = user(IDS.teacher); if (teacher) teacher.balance = Math.round(teacher.balance + s.teacherCut);
    if (lead.trafferId) { const t = user(lead.trafferId); if (t) t.balance = Math.round(t.balance + s.trafferCut); }
    const admin = user(IDS.admin); if (admin) admin.balance = Math.round(admin.balance + s.adminCut);
    addNotice(lead.studentId, 'Оплата прошла', c.title);
    if (lead.trafferId) addNotice(lead.trafferId, 'Лид оплачен', `${user(lead.studentId)?.fullName} · ${shortMoney(s.trafferCut)}`);
    addNotice(IDS.teacher, 'Новый ученик', `${user(lead.studentId)?.fullName} · ${c.title}`);
    message = 'Оплачено';
  }
  else if (a === 'deal-type') { dealType = btn.dataset.type; }
  else if (a === 'toggle-traffer') { dealNoTraffer = btn.checked; }
  else if (a === 'create-deal') {
    const student = user(dealStudent);
    const teacher = user(dealTeacher);
    const traffer = dealNoTraffer ? null : user(dealTraffer);
    if (!student || !teacher) message = 'Выберите участников';
    else {
      const c = state.courses.find(x => x.type === dealType) || state.courses[0];
      const s = split(dealType, !!traffer, dealType === 'group');
      let lead = state.leads.find(l => l.studentId === student.id && ['new','calling','waiting_payment'].includes(l.status));
      if (!lead) {
        lead = {id: state.nextLeadId++, studentId: student.id, trafferId: traffer?.id || null, courseId: c.id, status: 'waiting_payment', createdAt: new Date().toISOString()};
        state.leads.push(lead);
      }
      lead.status = 'paid';
      lead.trafferId = traffer?.id || null;
      const deal = {
        id: state.nextDealId++, leadId: lead.id, studentId: student.id, trafferId: traffer?.id || null, teacherId: teacher.id,
        groupId: dealType==='group' ? `G-${state.nextDealId}` : null,
        totalAmount: s.total, trafferCut: s.trafferCut, teacherCut: s.teacherCut, adminCut: s.adminCut,
        paymentStatus: 'success', payoutStatus: 'unpaid', createdAt: new Date().toISOString()
      };
      state.deals.push(deal);
      teacher.balance = Math.round(teacher.balance + s.teacherCut);
      if (traffer) traffer.balance = Math.round(traffer.balance + s.trafferCut);
      const admin = user(IDS.admin); if (admin) admin.balance = Math.round(admin.balance + s.adminCut);
      addNotice(student.id, 'Сделка создана', c.title);
      addNotice(teacher.id, 'Новый ученик', student.fullName);
      if (traffer) addNotice(traffer.id, 'Сделка', `${student.fullName} · ${shortMoney(s.trafferCut)}`);
      message = `Сделка #${deal.id}`;
      tab = 'leads';
    }
  }
  else if (a === 'pick-payout') { payoutPicked = +btn.dataset.id; payoutAmount = ''; }
  else if (a === 'do-payout') {
    const person = user(payoutPicked);
    const amount = Math.min(+payoutAmount || person.balance, person.balance);
    if (!person || amount <= 0) message = 'Некорректная сумма';
    else {
      person.balance = Math.round(person.balance - amount);
      if (person.balance <= 0) {
        person.balance = 0;
        state.deals.filter(d => d.payoutStatus === 'unpaid' && (d.trafferId === person.id || d.teacherId === person.id))
          .forEach(d => d.payoutStatus = 'paid');
      }
      addNotice(person.id, 'Выплата', shortMoney(amount));
      message = `Выплачено ${shortMoney(amount)}`;
      payoutPicked = null;
    }
  }
  else if (a === 'reset') {
    state = seed();
    tab = 'overview'; bell = false; dealType = 'individual'; dealNoTraffer = false;
    dealStudent = '900000004'; dealTeacher = '900000003'; dealTraffer = '900000002';
    payoutPicked = null; payoutAmount = '';
    message = 'Витрина сброшена';
  }
  save();
  render();
  if (message) notify(message);
});

document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.field === 'dealStudent') dealStudent = el.value;
  if (el.dataset.field === 'dealTeacher') dealTeacher = el.value;
  if (el.dataset.field === 'dealTraffer') dealTraffer = el.value;
  if (el.dataset.field === 'payoutAmount') payoutAmount = el.value;
  if (el.dataset.action === 'toggle-traffer') { dealNoTraffer = el.checked; render(); }
});

const splash = document.getElementById('splash');
setTimeout(() => splash?.classList.add('hide'), 4200);
render();

</script>
<script>(()=>{
const root=document.documentElement,body=document.body,app=document.getElementById('app'),splash=document.getElementById('splash');
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
body.classList.add('pre');
const go=()=>{if(!body.classList.contains('pre'))return;body.classList.remove('pre');setTimeout(()=>root.classList.add('settled'),2400)};
if(splash){
  if(splash.classList.contains('hide'))go();
  new MutationObserver(()=>splash.classList.contains('hide')&&go()).observe(splash,{attributes:true,attributeFilter:['class']});
  splash.addEventListener('click',()=>splash.classList.add('hide'));
}else go();

// cursor light (mouse only) + card spotlight + splash parallax
let L=null,tx=innerWidth/2,ty=innerHeight/3,cx=tx,cy=ty,run=false,raf=0;
if(matchMedia('(hover:hover)').matches&&!reduce){L=document.createElement('div');L.className='cursor-light';body.appendChild(L);L.style.transform=`translate3d(${cx-300}px,${cy-300}px,0)`}
function tick(){cx+=(tx-cx)*.12;cy+=(ty-cy)*.12;L.style.transform=`translate3d(${cx-300}px,${cy-300}px,0)`;if(Math.abs(tx-cx)+Math.abs(ty-cy)>.5)requestAnimationFrame(tick);else run=false}
addEventListener('pointermove',e=>{
  if(L){tx=e.clientX;ty=e.clientY;if(!run){run=true;requestAnimationFrame(tick)}}
  if(raf)return;
  raf=requestAnimationFrame(()=>{raf=0;
    const t=e.target.closest&&e.target.closest('.card,.stat,.why-btn');
    if(t){const r=t.getBoundingClientRect();t.style.setProperty('--mx',e.clientX-r.left+'px');t.style.setProperty('--my',e.clientY-r.top+'px')}
    if(splash&&!splash.classList.contains('hide')){
      const ry=((e.clientX/innerWidth-.5)*16)+'deg',rx=(-(e.clientY/innerHeight-.5)*12)+'deg';
      splash.querySelectorAll('.splash-stage').forEach(st=>{st.style.setProperty('--ry',ry);st.style.setProperty('--rx',rx)});
    }
  });
},{passive:true});

// echo: every tap sends a ring
addEventListener('pointerdown',e=>{
  if(reduce||!e.target.closest('button,.chip,.card'))return;
  const r=document.createElement('i');r.className='echo-ring';r.style.left=e.clientX+'px';r.style.top=e.clientY+'px';
  body.appendChild(r);r.addEventListener('animationend',()=>r.remove());
},{passive:true});

// per-render hooks
let lastKey=null,lastUser=null,box=null;
const last={n:null,v:0};
function cut(){const f=document.createElement('div');f.className='cut';body.appendChild(f);f.addEventListener('animationend',()=>f.remove())}
function tabs(sameUser){
  const bar=app.querySelector('.tabs');if(!bar){box=null;return}
  const a=bar.querySelector('.tab.active'),ind=document.createElement('i');ind.className='tab-ind';bar.prepend(ind);
  if(box&&sameUser){ind.style.transition='none';ind.style.width=box.w+'px';ind.style.transform=`translateX(${box.l}px)`;ind.offsetWidth;ind.style.transition=''}
  ind.style.width=a.offsetWidth+'px';ind.style.transform=`translateX(${a.offsetLeft}px)`;
  box={l:a.offsetLeft,w:a.offsetWidth};
}
function countUp(){
  const el=app.querySelector('.balance:not([data-c])');if(!el)return;el.dataset.c=1;
  const txt=el.textContent,m=txt.match(/\d[\d\s\u00a0\u202f]*/);if(!m)return;
  const to=+m[0].replace(/\D/g,''),nm=(app.querySelector('.name')||{}).textContent;
  const from=nm===last.n?last.v:0;last.n=nm;last.v=to;
  if(from===to||reduce)return;
  const pre=txt.slice(0,m.index),tail=m[0].match(/\s*$/)[0],post=txt.slice(m.index+m[0].length);
  const nf=new Intl.NumberFormat('ru-RU'),t0=performance.now(),D=1600;
  const draw=v=>el.textContent=pre+nf.format(Math.round(v))+tail+post;
  draw(from);
  (function step(t){
    if(!el.isConnected)return;
    const p=Math.min(1,(t-t0)/D),e=p===1?1:1-Math.pow(2,-10*p);
    draw(from+(to-from)*e);if(p<1)requestAnimationFrame(step);
  })(t0);
}
function onRender(){
  const c=app.querySelector('.chip.active'),t=app.querySelector('.tab.active');
  const u=c?c.dataset.id:'',k=u+'|'+(t?t.dataset.tab:''),sameUser=u===lastUser;
  app.classList.toggle('still',k===lastKey);   // re-render without scene change = no replay
  if(lastKey!==null&&!sameUser&&!reduce)cut();
  tabs(sameUser&&lastKey!==null);
  lastKey=k;lastUser=u;countUp();
}
new MutationObserver(onRender).observe(app,{childList:true});
onRender();
})();
</script>
