<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#050505;--graphite:rgba(24,25,27,.64);--silver:#c0c0c0;--paper:#fff;--mist:#8d8d8d;--line:rgba(255,255,255,.12);--sans:'Manrope',system-ui,sans-serif;--display:'Unbounded',system-ui,sans-serif}*{box-sizing:border-box}html{background:#000;color:#fff;scroll-behavior:smooth}body{margin:0;min-height:100vh;overflow-x:hidden;background:radial-gradient(900px 520px at 100% 0%,#1a1a1a 0%,#000 58%);font-family:var(--sans);font-size:14px}button,input{font:inherit}button{cursor:pointer;color:inherit}button:disabled{cursor:not-allowed;opacity:.4}button:focus-visible,input:focus-visible{outline:1px solid #ddd;outline-offset:3px}::selection{background:#c0c0c0;color:#000}.scene{position:fixed;inset:0;z-index:0;pointer-events:none}.scene canvas{width:100%;height:100%;display:block}.scrim{position:fixed;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.5),rgba(0,0,0,.18) 20%,rgba(0,0,0,.78) 46%,#000 68%)}.app{position:relative;z-index:2;width:min(100%,600px);padding:22px 16px 64px;margin:0 auto}.topline{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-family:var(--display);font-size:12px;letter-spacing:.22em}.brand-sub{font-size:11px;letter-spacing:.22em;color:var(--mist);margin-top:5px}.iconbtn,.chip,.btn,.tab,.personbtn,.typebtn,.payout-person{border:1px solid var(--line);background:rgba(25,25,27,.48);backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);transition:background .2s,border-color .2s,transform .2s}.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;position:relative}.iconbtn svg{width:17px;height:17px}.dot{position:absolute;right:9px;top:9px;width:6px;height:6px;background:#fff;border-radius:50%}.people-switch{display:flex;gap:8px;overflow-x:auto;padding:3px 0 5px;scrollbar-width:none}.people-switch::-webkit-scrollbar{display:none}.chip{flex:0 0 auto;border-radius:99px;min-height:42px;padding:0 16px;color:#c0c0c0;white-space:nowrap}.chip.active,.btn.primary,.tab.active,.typebtn.active,.payout-person.active{background:#fff;color:#050505;border-color:#fff;font-weight:600}.noticebox{margin-top:12px;max-height:260px;overflow:auto;padding:10px;border:1px solid var(--line);border-radius:24px;background:rgba(25,25,27,.72);backdrop-filter:blur(25px)}.notice{padding:10px}.notice p{margin:0}.notice .muted{margin-top:5px}.name{font-family:var(--display);font-size:24px;line-height:1.3;margin:27px 0 6px;overflow-wrap:anywhere}.muted{color:var(--mist)}.silver{color:var(--silver)}.balance{font-family:var(--display);font-size:clamp(34px,8vw,48px);line-height:1.2;letter-spacing:-.045em;margin-top:24px;font-variant-numeric:tabular-nums}.balance-label{color:var(--silver);margin-top:8px}.stack{display:flex;flex-direction:column;gap:13px;margin-top:25px}.card{border:1px solid rgba(255,255,255,.11);border-radius:27px;background:rgba(24,25,27,.64);padding:20px;backdrop-filter:blur(26px) saturate(150%);-webkit-backdrop-filter:blur(26px) saturate(150%);box-shadow:inset 0 1px 0 rgba(255,255,255,.035)}h2{font-family:var(--display);font-weight:400;font-size:17px;line-height:1.5;margin:0}p{line-height:1.55}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.row{display:flex;align-items:center;gap:13px}.between{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.btn{min-height:44px;border-radius:99px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;color:#fff;font-size:13px}.btn.primary{background:#fff;color:#050505;border-color:#fff}.btn.ghost{background:transparent}.btn.full{width:100%;margin-top:16px}.btn svg{width:16px;height:16px}.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.pill{flex:0 0 auto;border-radius:99px;padding:6px 10px;border:1px solid rgba(255,255,255,.16);color:var(--silver);font-size:11px}.pill.solid{background:#fff;color:#000;border-color:#fff}.small{font-size:12px}.tiny{font-size:11px}.eyebrow{font-size:12px;color:var(--silver);display:flex;align-items:center;gap:8px}.linktext{font-size:13px;overflow-wrap:anywhere;line-height:1.6;margin-top:13px}.ring{width:112px;height:112px;flex:0 0 112px}.ring text{font-family:var(--display)}.chart{height:155px;width:100%;margin-top:12px}.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:20px}.metric-label{font-size:11px;color:var(--mist)}.metric-value{font-family:var(--display);font-size:17px;margin-top:6px;overflow-wrap:anywhere}.tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.tab,.typebtn{min-height:44px;border-radius:99px;padding:0 12px;font-size:12px;color:var(--silver)}.lead-list{display:flex;flex-direction:column;gap:12px}.lead-meta{font-size:11px;color:var(--mist);line-height:1.6;margin-top:12px;overflow-wrap:anywhere}.field{display:block;margin-top:15px}.field span{display:block;color:var(--mist);font-size:11px;margin-bottom:7px}.field input{height:48px;width:100%;border-radius:18px;border:1px solid var(--line);background:rgba(0,0,0,.4);padding:0 15px;color:#fff;outline:none}.field input:focus{border-color:#c0c0c0}.quick-picks{display:flex;gap:7px;overflow:auto;margin-top:8px;padding-bottom:3px;scrollbar-width:none}.personbtn{white-space:nowrap;flex:0 0 auto;min-height:40px;border-radius:99px;padding:0 12px;font-size:11px;color:var(--silver)}.type-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:15px}.cut-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}.cut-grid dt{font-size:12px;color:var(--mist)}.cut-grid dd{margin:5px 0 0;font-variant-numeric:tabular-nums}.payout-person{width:100%;display:flex;align-items:center;justify-content:space-between;text-align:left;gap:10px;border-radius:20px;padding:12px;margin-top:8px}.payout-person small{display:block;font-size:10px;opacity:.7;margin-top:4px}.footer{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:30px;color:var(--mist);font-size:11px}.footer .brand{font-size:11px}.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:20;width:min(92vw,380px);padding:13px 16px;border:1px solid var(--line);border-radius:22px;background:rgba(24,25,27,.88);backdrop-filter:blur(24px);text-align:center;box-shadow:0 10px 45px #0008}.empty{color:var(--mist);font-size:13px;padding:8px 0}.chart-empty{color:var(--mist);font-size:13px;padding-top:12px}.notice-trigger{position:relative}.line{height:1px;background:var(--line);margin:16px 0}@media(min-width:1024px){.app{margin-left:40px;margin-right:auto;padding-top:28px}.scrim{background:linear-gradient(90deg,rgba(0,0,0,.94) 0%,rgba(0,0,0,.82) 36%,rgba(0,0,0,.28) 66%,rgba(0,0,0,.48) 100%)}}@media(max-width:380px){.card{padding:17px}.name{font-size:21px}.ring{width:95px;flex-basis:95px}.metric-value{font-size:15px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head>
<body><div class="scene" aria-hidden="true"><canvas id="metal-scene"></canvas></div><div class="scrim"></div><main class="app" id="app"></main><div id="toast" class="toast" role="status" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const $=s=>document.querySelector(s);const money=n=>new Intl.NumberFormat('ru-RU',{style:'currency',currency:'RUB',maximumFractionDigits:0}).format(Math.round(n));const shortMoney=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0}).format(Math.round(n))+' ₽';const ago=d=>new Date(Date.parse('2026-10-01T12:00:00Z')-d*86400000).toISOString();const dateLabel=s=>new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'short',timeZone:'UTC'}).format(new Date(s));const ROLE={admin:'админ',traffer:'трафер',teacher:'преподаватель',student:'ученик'};const STATUS={new:'новая',calling:'созвон',rejected:'отказ',waiting_payment:'счёт',paid:'оплачено'};const IDS={admin:900000001,traffer:900000002,teacher:900000003,kirill:900000004,sofia:900000005,ilya:900000006,platon:900000007,timur:900000008,nora:900000009,mira:900000010};const castIds=[IDS.admin,IDS.traffer,IDS.teacher,IDS.kirill];const refLink=code=>`https://t.me/EchoAcademyBot?start=ref_${code}`;const split=(type,hasTraffer,bundle=false)=>{let total=type==='individual'?90000:bundle?180000:60000;let tc=hasTraffer?(type==='individual'?total*.1:total*.15*(bundle?3:1)):0;let teacher=total*.5;return {total,trafferCut:tc,teacherCut:teacher,adminCut:total-tc-teacher}};
function seed(){const users=[['Ева Морозова','eva','admin',40],['Марк Левин','marklev','traffer',36],['Алина Сергеева','alina','teacher',34],['Кирилл Орлов','kirill','student',8],['Софья Ким','sofia','student',18],['Илья Волков','ilya','student',22],['Платон Широков','platon','student',16],['Тимур Сафин','timur','student',12],['Нора Белова','nora','student',4],['Мира Донцова','mira','student',3]].map((x,i)=>({id:900000001+i,fullName:x[0],username:x[1],role:x[2],balance:0,isActive:true,refCode:'user_'+(900000001+i),createdAt:ago(x[3])}));const courses=[{id:1,title:'Моушн-дизайн',type:'individual',basePrice:90000,durationDays:60},{id:2,title:'Разработка ботов',type:'group',basePrice:60000,durationDays:45},{id:3,title:'Саунд-дизайн',type:'individual',basePrice:90000,durationDays:50}].map(c=>({...c,createdAt:ago(40)}));const leads=[{id:1,studentId:IDS.ilya,trafferId:null,courseId:3,status:'paid',createdAt:ago(14)},{id:2,studentId:IDS.platon,trafferId:IDS.traffer,courseId:1,status:'paid',createdAt:ago(8)},{id:3,studentId:IDS.sofia,trafferId:IDS.traffer,courseId:2,status:'paid',createdAt:ago(3)},{id:4,studentId:IDS.kirill,trafferId:IDS.traffer,courseId:1,status:'waiting_payment',createdAt:ago(1)},{id:5,studentId:IDS.nora,trafferId:IDS.traffer,courseId:2,status:'new',createdAt:ago(1)},{id:6,studentId:IDS.timur,trafferId:null,courseId:3,status:'rejected',createdAt:ago(5)},{id:7,studentId:IDS.mira,trafferId:IDS.traffer,courseId:2,status:'calling',createdAt:ago(2)}];const d1=split('individual',false),d2=split('individual',true),d3=split('group',true);const deals=[{id:1,leadId:1,studentId:IDS.ilya,trafferId:null,teacherId:IDS.teacher,groupId:null,...d1,paymentStatus:'success',payoutStatus:'paid',createdAt:ago(12)},{id:2,leadId:2,studentId:IDS.platon,trafferId:IDS.traffer,teacherId:IDS.teacher,groupId:null,...d2,paymentStatus:'success',payoutStatus:'unpaid',createdAt:ago(6)},{id:3,leadId:3,studentId:IDS.sofia,trafferId:IDS.traffer,teacherId:IDS.teacher,groupId:'G-14',...d3,paymentStatus:'success',payoutStatus:'unpaid',createdAt:ago(2)}];for(const d of deals)if(d.payoutStatus!=='paid'){addBalance(users,d.trafferId,d.trafferCut);addBalance(users,d.teacherId,d.teacherCut);addBalance(users,IDS.admin,d.adminCut)}return {users,courses,leads,deals,notices:[{id:1,userId:IDS.traffer,title:'Начисление',body:'Платон Широков оплатил «Моушн-дизайн». На баланс +9 000 ₽.',createdAt:ago(6),read:true},{id:2,userId:IDS.teacher,title:'Новый ученик',body:'Софья Ким — место в группе «Разработка ботов». Вам +30 000 ₽.',createdAt:ago(2),read:false},{id:3,userId:IDS.traffer,title:'Начисление',body:'Софья Ким оплатила групповое место. На баланс +9 000 ₽.',createdAt:ago(2),read:false},{id:4,userId:IDS.admin,title:'К выплате',body:'На балансах: Марк Левин 18 000 ₽, Алина Сергеева 75 000 ₽.',createdAt:ago(1),read:false}],nextUserId:900000100,nextLeadId:8,nextDealId:4,nextNoticeId:5,activeUserId:IDS.traffer}}
function addBalance(users,id,n){const u=users.find(x=>x.id===id);if(u)u.balance=Math.round((u.balance+n)*100)/100}let state;try{state=JSON.parse(localStorage.getItem('echo-academy-v1'))||seed()}catch{state=seed()}let tab='overview',bell=false,toastTimer=null,dealType='individual',dealNoTraffer=false,dealStudent='900000004',dealTeacher='900000003',dealTraffer='900000002',payoutPicked=null,payoutAmount='';function save(){localStorage.setItem('echo-academy-v1',JSON.stringify(state))}function user(id){return state.users.find(x=>x.id===Number(id))}function course(id){return state.courses.find(x=>x.id===Number(id))}function notify(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.hidden=true,2800)}function card(s){return `<section class="card">${s}</section>`}function pill(text,solid=false){return `<span class="pill ${solid?'solid':''}">${text}</span>`}function ring(value){value=Math.max(0,Math.min(1,value||0));const circ=2*Math.PI*42;return `<svg class="ring" viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="42" stroke="rgba(255,255,255,.12)" stroke-width="8" fill="none"/><circle cx="60" cy="60" r="42" stroke="#c0c0c0" stroke-width="8" fill="none" stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${circ*(1-value)}" transform="rotate(-90 60 60)"/><text x="60" y="64" text-anchor="middle" fill="#fff" font-size="22">${Math.round(value*100)}%</text></svg>`}function series(deals,pick){const map={};deals.slice().sort((a,b)=>a.createdAt.localeCompare(b.createdAt)).forEach(d=>{const label=dateLabel(d.createdAt);map[label]=(map[label]||0)+pick(d)});return Object.entries(map).map(([label,amount])=>({label,amount}))}function chart(points,label){if(!points.length)return `<div class="chart-empty">Пока нет оплаченных сделок.</div>`;const max=Math.max(...points.map(p=>p.amount),1),w=500,h=140,pad=12;const coords=points.map((p,i)=>[pad+(points.length===1?w/2-pad:i*(w-2*pad)/(points.length-1)),h-pad-(p.amount/max)*(h-2*pad)]);const line=coords.map(p=>p.join(',')).join(' '),area=`${pad},${h} ${line} ${w-pad},${h}`;return `<svg class="chart" viewBox="0 0 ${w} ${h+20}" preserveAspectRatio="none"><defs><linearGradient id="chartfill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#c0c0c0" stop-opacity=".42"/><stop offset="100%" stop-color="#c0c0c0" stop-opacity="0"/></linearGradient></defs><polygon points="${area}" fill="url(#chartfill)"/><polyline points="${line}" fill="none" stroke="#c0c0c0" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${points.map((p,i)=>`<text x="${coords[i][0]}" y="${h+14}" fill="#8d8d8d" font-size="10" text-anchor="middle">${p.label}</text>`).join('')}</svg>`}function header(active){const cast=castIds.map(user).filter(Boolean),extra=cast.some(x=>x.id===active.id)?[]:[active],mine=state.notices.filter(n=>n.userId===active.id),unread=mine.filter(n=>!n.read).length;return `<header><div class="topline"><div><div class="brand">ECHO</div><div class="brand-sub">ACADEMY</div></div><button class="iconbtn notice-trigger" data-action="bell" aria-label="Уведомления" aria-expanded="${bell}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg>${unread?'<i class="dot"></i>':''}</button></div>${bell?`<div class="noticebox">${mine.length?mine.map(n=>`<article class="notice"><p>${n.title}</p><p class="muted">${n.body}</p></article>`).join(''):'<p class="empty">Тишина. Начислений и запросов нет.</p>'}</div>`:''}<div class="people-switch" role="radiogroup" aria-label="Кабинет">${[...cast,...extra].map(p=>`<button class="chip ${p.id===active.id?'active':''}" data-action="pick-user" data-id="${p.id}" role="radio" aria-checked="${p.id===active.id}">${p.fullName.split(' ')[0]}</button>`).join('')}</div></header>`}function leadList(title,leads){return `<div class="lead-list"><h2>${title}</h2>${leads.length?leads.slice().sort((a,b)=>b.id-a.id).map(l=>{const student=user(l.studentId),tr=user(l.trafferId),c=course(l.courseId);return card(`<div class="between"><div><div>${student?.fullName||'Без имени'}</div><div class="muted small" style="margin-top:5px">${c?.title||'Ниша'}</div></div>${pill(STATUS[l.status],l.status==='paid')}</div><div class="lead-meta">#${l.id} · ученик ${l.studentId} · трафер ${tr?`${tr.fullName} · ${tr.id}`:'—'} · ${dateLabel(l.createdAt)}</div>`) }).join(''):'<div class="empty">Заявок нет.</div>'}</div>`}
function trafferHome(u){const leads=state.leads.filter(l=>l.trafferId===u.id),deals=state.deals.filter(d=>d.trafferId===u.id),paid=leads.filter(l=>l.status==='paid').length,link=refLink(u.refCode);return card(`<div class="eyebrow">↗ <span>Моя ссылка</span></div><div class="linktext">${link}</div><div class="btns"><button class="btn primary" data-action="copy" data-text="${link}">▢ Копировать</button><button class="btn ghost" data-action="arrive">↻ Новый ученик по ссылке</button></div>`)+card(`<div class="row">${ring(leads.length?paid/leads.length:0)}<div><h2>Статистика</h2><p class="silver" style="margin:5px 0">${paid} оплат из ${leads.length} заявок</p><p class="muted tiny">Конверсия — доля заявок со статусом «оплачено».</p></div></div>${chart(series(deals,d=>d.trafferCut),'Начисления')}`)+card(`<div class="section-head"><h2>Баланс</h2><button class="btn primary" data-action="request-payout" ${u.balance<=0?'disabled':''}>Запросить вывод</button></div><p class="muted small">Админ увидит id и сумму в уведомлениях.</p>`)+leadList('Мои заявки',leads)}function teacherHome(u){const deals=state.deals.filter(d=>d.teacherId===u.id);return card(`<div class="section-head"><h2>Баланс</h2><button class="btn primary" data-action="request-payout" ${u.balance<=0?'disabled':''}>Запросить вывод</button></div>`)+`<div class="lead-list"><h2>Ученики</h2>${deals.length?deals.map(d=>{const st=user(d.studentId),l=state.leads.find(x=>x.id===d.leadId),c=l&&course(l.courseId);return card(`<div class="between"><div>${st?.fullName||'Ученик'}<div class="muted small" style="margin-top:5px">${c?.title||'Курс'}</div></div>${pill(d.payoutStatus==='paid'?'выплачено':money(d.teacherCut),d.payoutStatus==='paid')}</div>`) }).join(''):'<div class="empty">Пока никто не закреплён.</div>'}</div>`}function studentHome(u){const mine=state.leads.filter(l=>l.studentId===u.id),open=mine.filter(l=>['new','calling','waiting_payment'].includes(l.status)),deals=state.deals.filter(d=>d.studentId===u.id);let html=`<div class="lead-list"><h2>Мои курсы</h2>${deals.length?deals.map(d=>{const l=state.leads.find(x=>x.id===d.leadId),c=l&&course(l.courseId);return card(`<div class="between"><div>${c?.title||'Курс'}<div class="muted small" style="margin-top:5px">${c?c.durationDays+' дней':'Доступ открыт'}</div></div>${pill(money(d.totalAmount),true)}</div>`) }).join(''):card('<p class="muted" style="margin:0">Оплаченных курсов пока нет.</p>')}</div><div class="lead-list"><h2>Оплатить</h2>${open.length?open.map(l=>{const c=course(l.courseId);return card(`<div class="between"><div>${c?.title}<div class="silver small" style="margin-top:5px">${STATUS[l.status]} · ${c?money(c.basePrice):''}</div></div>${pill(c?.type==='group'?'группа':'индив.')}</div><button class="btn primary full" data-action="pay" data-id="${l.id}">Оплатить</button>`) }).join(''):card('<p class="muted" style="margin:0">Нет открытого счёта. Выберите направление ниже.</p>')}</div><div class="lead-list"><h2>Направления</h2>${state.courses.map(c=>card(`<div class="between"><div>${c.title}<div class="muted small" style="margin-top:5px">${c.type==='group'?'Группа':'Индивидуально'} · ${c.durationDays} дней</div></div><div style="font-family:var(--display);font-size:13px">${money(c.basePrice)}</div></div><button class="btn ghost" style="margin-top:15px" data-action="enroll" data-id="${c.id}">Получить счёт</button>`)).join('')}</div>`;return html}function systemPanel(){const leads=state.leads,deals=state.deals,paid=leads.filter(l=>l.status==='paid').length,turnover=deals.reduce((s,d)=>s+d.totalAmount,0),owed=state.users.reduce((s,u)=>s+u.balance,0);return card(`<h2>Статистика системы</h2><div class="metric-grid"><div><div class="metric-label">Лиды</div><div class="metric-value">${leads.length}</div></div><div><div class="metric-label">Оплачено</div><div class="metric-value">${paid}</div></div><div><div class="metric-label">Оборот</div><div class="metric-value">${money(turnover)}</div></div><div><div class="metric-label">К выплате</div><div class="metric-value">${money(owed)}</div></div></div><div class="row" style="margin-top:20px">${ring(leads.length?paid/leads.length:0)}<p class="silver small">Конверсия всех заявок в оплату.</p></div>${chart(series(deals,d=>d.totalAmount),'Оборот')}`)}function quickPeople(role,field){return `<div class="quick-picks">${state.users.filter(u=>u.role===role).slice(0,8).map(u=>`<button class="personbtn" data-action="set-field" data-field="${field}" data-id="${u.id}">${u.fullName.split(' ')[0]} · ${u.id}</button>`).join('')}</div>`}function field(label,id,value){return `<label class="field"><span>${label}</span><input id="${id}" inputmode="numeric" autocomplete="off" value="${value}"></label>`}function dealPanel(){const cuts=split(dealType,!dealNoTraffer&&!!dealTraffer.trim(),dealType==='group');return card(`<h2>Создать сделку</h2><p class="muted small">Индивидуально 90 000 ₽: трафер 10%, преподаватель 50%, админ 40%. Группа 180 000 ₽: трафер 9 000 ₽ с места, преподаватель 50%, админ остаток.</p><div class="type-row"><button class="typebtn ${dealType==='individual'?'active':''}" data-action="deal-type" data-type="individual">Индивидуально · 90к</button><button class="typebtn ${dealType==='group'?'active':''}" data-action="deal-type" data-type="group">Группа · 180к</button></div>${field('ID ученика','deal-student',dealStudent)}${quickPeople('student','dealStudent')}${field('ID преподавателя','deal-teacher',dealTeacher)}${quickPeople('teacher','dealTeacher')}${field('ID трафера','deal-traffer',dealTraffer)}${quickPeople('traffer','dealTraffer')}<button class="btn ghost" data-action="no-traffer">${dealNoTraffer?'Трафер выключен':'Без трафера'}</button><dl class="cut-grid"><div><dt>Сумма</dt><dd>${money(cuts.total)}</dd></div><div><dt>Трафер</dt><dd>${money(cuts.trafferCut)}</dd></div><div><dt>Преподаватель</dt><dd>${money(cuts.teacherCut)}</dd></div><div><dt>Админ</dt><dd>${money(cuts.adminCut)}</dd></div></dl><button class="btn primary full" data-action="create-deal">Провести сделку</button>`)}function payoutsPanel(){const owed=state.users.filter(u=>u.balance>0);if(!owed.length)return card('<h2>Выплаты</h2><p class="muted">Никто не ждёт деньги.</p>');let person=owed.find(u=>u.id===payoutPicked)||owed[0];if(payoutPicked===null){payoutPicked=person.id;payoutAmount=String(Math.round(person.balance))}return card(`<h2>Выплаты</h2><div style="margin-top:10px">${owed.map(u=>`<button class="payout-person ${u.id===person.id?'active':''}" data-action="pick-payout" data-id="${u.id}"><span>${u.fullName}<small>${ROLE[u.role]} · ${u.id}</small></span><span>${money(u.balance)}</span></button>`).join('')}</div>${field('Сумма выплаты','payout-amount',payoutAmount)}<button class="btn primary full" data-action="make-payout">Выплатить</button>`)}function adminHome(){const tabs=[['overview','Система'],['leads','Все лиды'],['deal','Сделка'],['payouts','Выплаты']];return `<div class="tabs">${tabs.map(([id,label])=>`<button class="tab ${tab===id?'active':''}" data-action="tab" data-tab="${id}">${label}</button>`).join('')}</div>${tab==='overview'?systemPanel():tab==='leads'?leadList('Все лиды',state.leads):tab==='deal'?dealPanel():payoutsPanel()}`}function render(){const active=user(state.activeUserId)||state.users[0];if(!active)return;$('#app').innerHTML=`${header(active)}<p class="name">${active.fullName}</p><p class="muted" style="margin:0">${ROLE[active.role]}${active.username?' · @'+active.username:''}</p><div class="balance">${money(active.balance)}</div><div class="balance-label">к выплате</div><div class="stack">${active.role==='traffer'?trafferHome(active):active.role==='teacher'?teacherHome(active):active.role==='student'?studentHome(active):adminHome()}</div><footer class="footer"><span class="brand">ECHO</span><button class="btn ghost" data-action="reset" style="min-height:36px;padding:0 10px;font-size:11px">Сбросить витрину</button></footer>`}
function addNotice(userId,title,body){state.notices.unshift({id:state.nextNoticeId++,userId,title,body,createdAt:new Date().toISOString(),read:false})}function actionPay(id){const l=state.leads.find(x=>x.id===id);if(!l)return 'Счёт не найден';if(l.status==='paid')return 'Счёт уже оплачен';const c=course(l.courseId),traffer=l.trafferId,teacher=state.users.find(u=>u.role==='teacher'),cuts=split(c.type,!!traffer,c.type==='group');l.status='paid';const d={id:state.nextDealId++,leadId:l.id,studentId:l.studentId,trafferId:traffer,teacherId:teacher?.id,groupId:c.type==='group'?'seat-'+l.id:null,...cuts,paymentStatus:'success',payoutStatus:'unpaid',createdAt:new Date().toISOString()};state.deals.unshift(d);addBalance(state.users,traffer,cuts.trafferCut);addBalance(state.users,teacher?.id,cuts.teacherCut);addBalance(state.users,IDS.admin,cuts.adminCut);if(traffer)addNotice(traffer,'Начисление',`${user(l.studentId)?.fullName} оплатил(а) «${c.title}». На баланс +${money(cuts.trafferCut)}.`);if(teacher)addNotice(teacher.id,'Новый ученик',`${user(l.studentId)?.fullName} — ${c.title}. Вам +${money(cuts.teacherCut)}.`);return `Оплата прошла. Сделка ${shortMoney(cuts.total)}`}function createDeal(){const sid=Number(dealStudent),tid=Number(dealTeacher),tr=dealNoTraffer||!dealTraffer.trim()?null:Number(dealTraffer);if(!Number.isInteger(sid)||!Number.isInteger(tid))return 'ID ученика и преподавателя — целые числа';if(tr!==null&&!Number.isInteger(tr))return 'ID трафера — целое число или отключите трафера';const st=user(sid),te=user(tid),tra=tr?user(tr):null;if(!st)return 'Ученик с таким ID не найден';if(st.role!=='student')return 'Этот ID не принадлежит ученику';if(!te||te.role!=='teacher')return 'Преподаватель не найден';if(tr&&(!tra||tra.role!=='traffer'))return 'Трафер не найден';const c=state.courses.find(c=>c.type===dealType);if(!c)return 'Курс этого типа не заведён';const cuts=split(dealType,!!tr,dealType==='group');const lead=state.leads.slice().reverse().find(l=>l.studentId===sid&&['new','calling','waiting_payment'].includes(l.status));if(lead){lead.status='paid';lead.courseId=c.id;lead.trafferId=tr}const d={id:state.nextDealId++,leadId:lead?.id||null,studentId:sid,trafferId:tr,teacherId:tid,groupId:dealType==='group'?'G-'+state.nextDealId:null,...cuts,paymentStatus:'success',payoutStatus:'unpaid',createdAt:new Date().toISOString()};state.deals.unshift(d);addBalance(state.users,tr,cuts.trafferCut);addBalance(state.users,tid,cuts.teacherCut);addBalance(state.users,IDS.admin,cuts.adminCut);addNotice(tid,'Новая сделка',`${st.fullName} — ${c.title}. Вам +${money(cuts.teacherCut)}.`);return `Сделка создана · ${shortMoney(cuts.total)}`}
$('#app').addEventListener('input',e=>{if(e.target.id==='deal-student')dealStudent=e.target.value;if(e.target.id==='deal-teacher')dealTeacher=e.target.value;if(e.target.id==='deal-traffer'){dealTraffer=e.target.value;dealNoTraffer=false}if(e.target.id==='payout-amount')payoutAmount=e.target.value});$('#app').addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;let message='';if(a==='bell'){bell=!bell;if(bell)state.notices.filter(n=>n.userId===state.activeUserId).forEach(n=>n.read=true)}else if(a==='pick-user'){state.activeUserId=Number(b.dataset.id);tab='overview';bell=false;payoutPicked=null}else if(a==='tab')tab=b.dataset.tab;else if(a==='copy'){try{await navigator.clipboard.writeText(b.dataset.text);message='Ссылка скопирована'}catch{message='Скопируйте ссылку вручную: '+b.dataset.text}}else if(a==='arrive'){const traff=user(state.activeUserId),c=state.courses[0],id=state.nextUserId++,lid=state.nextLeadId++,names=['Глеб Морозов','Таисия Рэй','Лев Артемьев','Ника Соколова','Марта Эш'],name=names[(id-900000100)%names.length]||'Новый ученик';state.users.push({id,username:'guest'+id,fullName:name,role:'student',balance:0,isActive:true,refCode:'user_'+id,createdAt:new Date().toISOString()});state.leads.unshift({id:lid,studentId:id,trafferId:traff.id,courseId:c.id,status:'new',createdAt:new Date().toISOString()});addNotice(traff.id,'Новый переход',`${name} открыл ссылку. Заявка #${lid} · ${c.title} · статус new.`);message=`${name} · id ${id} · заявка #${lid}`}else if(a==='request-payout'){const u=user(state.activeUserId);if(u.balance<=0)message='Нет средств для вывода';else{addNotice(IDS.admin,'Запрос выплаты',`${u.fullName} (ID ${u.id}) запросил вывод ${money(u.balance)}.`);message='Запрос на вывод отправлен админу'}}else if(a==='tab'){}else if(a==='pay'){message=actionPay(Number(b.dataset.id))}else if(a==='enroll'){const c=course(b.dataset.id),existing=state.leads.find(l=>l.studentId===state.activeUserId&&l.courseId===c.id&&['new','calling','waiting_payment'].includes(l.status));if(existing)message=`Счёт по «${c.title}» уже открыт`;else{state.leads.unshift({id:state.nextLeadId++,studentId:state.activeUserId,trafferId:null,courseId:c.id,status:'waiting_payment',createdAt:new Date().toISOString()});message=`Счёт на «${c.title}» готов к оплате`}}else if(a==='deal-type'){dealType=b.dataset.type}else if(a==='set-field'){if(b.dataset.field==='dealStudent')dealStudent=b.dataset.id;if(b.dataset.field==='dealTeacher')dealTeacher=b.dataset.id;if(b.dataset.field==='dealTraffer'){dealTraffer=b.dataset.id;dealNoTraffer=false}}else if(a==='no-traffer')dealNoTraffer=!dealNoTraffer;else if(a==='create-deal')message=createDeal();else if(a==='pick-payout'){payoutPicked=Number(b.dataset.id);const u=user(payoutPicked);payoutAmount=String(Math.round(u.balance))}else if(a==='make-payout'){const person=user(payoutPicked),amount=Number($('#payout-amount')?.value);if(!person)message='Выберите человека';else if(!Number.isFinite(amount)||amount<=0)message='Введите сумму больше нуля';else if(amount>person.balance+.01)message='Сумма больше баланса';else{person.balance=Math.max(0,Math.round((person.balance-amount)*100)/100);if(person.balance<=.01){person.balance=0;state.deals.forEach(d=>{if((d.trafferId===person.id||d.teacherId===person.id)&&d.payoutStatus==='unpaid')d.payoutStatus='paid'})}addNotice(person.id,'Выплата',`Админ выплатил ${money(amount)}. Остаток ${money(person.balance)}.`);message=`Выплачено ${money(amount)}`}}else if(a==='reset'){state=seed();tab='overview';bell=false;dealType='individual';dealNoTraffer=false;dealStudent='900000004';dealTeacher='900000003';dealTraffer='900000002';payoutPicked=null;payoutAmount='';message='Витрина сброшена'}save();render();if(message)notify(message)});render();
// Three.js metallic orb scene — no app framework required.
try{const canvas=$('#metal-scene'),renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.75));renderer.setClearColor(0x000000,0);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.08;renderer.outputColorSpace=THREE.SRGBColorSpace;const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(36,1,.1,40);camera.position.set(0,.1,5.6);const root=new THREE.Group();scene.add(root);const sphere=new THREE.Mesh(new THREE.SphereGeometry(1.12,80,80),new THREE.MeshPhysicalMaterial({color:'#c0c0c0',metalness:1,roughness:.07,clearcoat:1,clearcoatRoughness:.04}));root.add(sphere);const ringMat=new THREE.MeshPhysicalMaterial({color:'#fff',metalness:1,roughness:.18,transparent:true,opacity:.82});const ringA=new THREE.Mesh(new THREE.TorusGeometry(1.78,.011,16,180),ringMat);ringA.rotation.x=Math.PI/2.35;root.add(ringA);const ringB=new THREE.Mesh(new THREE.TorusGeometry(2.18,.007,12,160),ringMat.clone());ringB.rotation.x=Math.PI/1.65;ringB.rotation.y=.55;root.add(ringB);const count=160,positions=new Float32Array(count*3);for(let i=0;i<count;i++){const r=2.35+((i*37)%100)/100,theta=i/count*Math.PI*2*7,y=(((i*17)%100)/100-.5)*2.2;positions[i*3]=Math.cos(theta)*r;positions[i*3+1]=y;positions[i*3+2]=Math.sin(theta)*r*.72}const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(positions,3));const particles=new THREE.Points(pg,new THREE.PointsMaterial({color:'#fff',size:.028,transparent:true,opacity:.72,depthWrite:false,sizeAttenuation:true}));root.add(particles);const key=new THREE.DirectionalLight(0xffffff,2.4);key.position.set(3.5,2.4,4);scene.add(key);const rim=new THREE.DirectionalLight(0xc0c0c0,1.5);rim.position.set(-4,-1.2,-2);scene.add(rim);scene.add(new THREE.AmbientLight(0xffffff,.18));let px=0,py=0;window.addEventListener('pointermove',e=>{px=e.clientX/(innerWidth||1)*2-1;py=e.clientY/(innerHeight||1)*2-1},{passive:true});const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches,started=performance.now();function fit(){const w=innerWidth,h=innerHeight;camera.aspect=w/h;camera.position.z=w>=1024?5.3:6.15;camera.updateProjectionMatrix();root.position.x=w>=1024?1.65:0;root.position.y=w>=1024?.05:.95;renderer.setSize(w,h,false)}fit();addEventListener('resize',fit);function tick(){const t=(performance.now()-started)/1000,speed=reduced?0:1;sphere.rotation.y=t*.16*speed;sphere.rotation.x=Math.sin(t*.13)*.06*speed;ringA.rotation.z=t*.11*speed;ringB.rotation.z=-t*.08*speed;particles.rotation.y=t*.045*speed;root.rotation.y+=(px*.42-root.rotation.y)*.045;root.rotation.x+=(-py*.22-root.rotation.x)*.045;renderer.render(scene,camera);requestAnimationFrame(tick)}tick()}catch(err){console.warn('Three.js scene unavailable',err)}
</script></body></html>
